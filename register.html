<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Регистрация — Anime Hub</title><link rel="stylesheet" href="css/style.css"></head><body data-page="auth"><header class="site-header"><a class="logo" href="index.html">Anime<span>Hub</span></a><a class="header-back" href="index.html">← Каталог</a></header><main class="auth-shell"><div class="auth-visual"><span>ANIME / 04</span><h1>Создай<br><em>свою</em><br>коллекцию.</h1></div><form id="registerForm" class="auth-card"><p class="eyebrow">NEW MEMBER</p><h2>Регистрация</h2><p class="auth-subtitle">Сохраняй тайтлы, которые не хочешь потерять.</p><label>Имя<input id="name" autocomplete="name" maxlength="80" type="text" placeholder="Твоё имя" required></label><label>Email<input id="email" autocomplete="email" type="email" placeholder="you@example.com" required></label><label>Пароль<input id="password" autocomplete="new-password" type="password" placeholder="Минимум 6 символов" minlength="6" required></label><button class="button" type="submit">Создать аккаунт <span>→</span></button><p id="message" role="status" aria-live="polite" class="form-message"></p><a class="auth-link" href="login.html">Уже есть аккаунт ↗</a></form></main><script type="module" src="js/auth.js"></script><script type="module" src="js/ui.js"></script></body></html>
